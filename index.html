<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pos Jaga Asrama — Catatan Keluar Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg: #EEF2ED;
    --surface: #FFFFFF;
    --ink: #1B2624;
    --ink-soft: #55635F;
    --primary: #1F4B4C;
    --primary-dark: #12302F;
    --accent: #E0982A;
    --danger: #BA3D22;
    --success: #2E7D56;
    --border: #D0D8D3;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(0,0,0,0.05);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body{
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 16px 14px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    transition: max-width 0.25s ease;
  }

  .wrap.wide{
    max-width: 820px;
  }

  /* Header */
  .masthead{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2.5px solid var(--primary);
    padding-bottom: 12px;
    margin-bottom: 16px;
    gap: 10px;
  }

  .masthead h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1.2;
  }

  .clock{
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    color: var(--ink-soft);
    font-size: 12px;
    flex-shrink: 0;
  }
  .clock .time{
    font-size: 18px;
    color: var(--primary-dark);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-top: 2px;
  }

  /* Card */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  /* Mode Switch Toggle */
  .toggle{
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
    background: var(--bg);
    padding: 3px;
    gap: 4px;
  }
  .toggle button{
    flex: 1;
    min-height: 48px;
    padding: 10px 6px;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle button.active.keluar{
    background: var(--danger);
    color: #fff;
    box-shadow: 0 2px 8px rgba(186, 61, 34, 0.3);
  }
  .toggle button.active.masuk{
    background: var(--success);
    color: #fff;
    box-shadow: 0 2px 8px rgba(46, 125, 86, 0.3);
  }

  /* Form Elements */
  label{
    display: block;
    font-size: 14px;
    color: var(--ink);
    margin: 14px 0 6px;
    font-weight: 600;
  }
  label:first-of-type{margin-top: 0;}

  input, textarea{
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  input:focus, textarea:focus{
    outline: none;
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(31, 75, 76, 0.15);
  }

  input[readonly]{
    background: #F1F4F2;
    color: #4A5652;
    cursor: default;
    border-color: #D8DFDB;
    font-weight: 500;
  }

  .readonly-badge{
    display: inline-block;
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-left: 6px;
    background: #E4ECE8;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Searchable Autocomplete Box */
  .autocomplete-wrap{
    position: relative;
  }
  .search-box{
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-box input{
    padding-right: 42px;
  }
  .btn-clear-search{
    position: absolute;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #DCE3DF;
    color: #4A5652;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .btn-clear-search:hover{
    background: #CBD5D0;
    color: var(--ink);
  }

  .dropdown-results{
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 240px;
    overflow-y: auto;
    background: var(--surface);
    border: 1.5px solid var(--primary);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 100;
    -webkit-overflow-scrolling: touch;
  }
  .dropdown-item{
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background 0.12s ease;
  }
  .dropdown-item:last-child{
    border-bottom: none;
  }
  .dropdown-item:hover, .dropdown-item:active{
    background: #EAF2EE;
  }
  .dropdown-item strong{
    font-size: 14.5px;
    color: var(--ink);
  }
  .dropdown-item span{
    font-size: 11.5px;
    color: var(--ink-soft);
    background: var(--bg);
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .dropdown-empty{
    padding: 16px 14px;
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  /* Group / Teman Section */
  .group-section{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .group-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .group-title{
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .btn-add-friend{
    background: none;
    border: 1.5px solid var(--primary);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .btn-add-friend:hover{
    background: var(--primary);
    color: #fff;
  }
  
  .friends-chips-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
  .friend-chip{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #EAF2EE;
    border: 1px solid #BFDECB;
    border-radius: 8px;
    font-size: 13.5px;
    animation: fadeIn 0.2s ease;
  }
  .friend-chip strong{
    color: var(--primary-dark);
  }
  .friend-chip span{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-left: 4px;
  }
  .btn-remove-friend{
    background: none;
    border: none;
    color: var(--danger);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    font-weight: 700;
  }

  textarea{
    resize: vertical;
    min-height: 80px;
    line-height: 1.45;
  }

  /* Submit Button */
  .submit-btn{
    width: 100%;
    margin-top: 20px;
    min-height: 52px;
    padding: 14px 16px;
    border: none;
    border-radius: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16.5px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .submit-btn:active{transform: scale(0.99);}
  .submit-btn.keluar{
    background: var(--danger);
    box-shadow: 0 4px 12px rgba(186, 61, 34, 0.25);
  }
  .submit-btn.masuk{
    background: var(--success);
    box-shadow: 0 4px 12px rgba(46, 125, 86, 0.25);
  }
  .submit-btn:disabled{
    opacity: 0.65;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Active List in Mode Masuk */
  .search-masuk-box{
    margin-bottom: 12px;
  }
  .active-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .active-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    gap: 8px;
    transition: border-color 0.15s ease;
  }
  .active-item:hover{
    border-color: var(--primary);
  }
  .active-info strong{
    display: block;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .active-info span{
    font-size: 12px;
    color: var(--ink-soft);
    display: block;
  }
  .btn-checkin{
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--success);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(46, 125, 86, 0.3);
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn-checkin:active{transform: scale(0.97);}
  .btn-checkin:disabled{opacity: 0.6; cursor: not-allowed;}

  /* Feedback Alerts */
  .feedback{
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.show{display: block;}
  .feedback.ok{background: #E4F0E9; color: var(--success); border: 1.5px solid #BFDECB;}
  .feedback.warn{background: #FBEDE3; color: var(--danger); border: 1.5px solid #F0CDB8;}
  .feedback.info{background: #EBF3F5; color: var(--primary); border: 1.5px solid #C4DDE2;}
  .feedback strong{color: #0E3524;}
  .feedback.warn strong{color: #7D210D;}

  .admin-link{
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    margin-top: 14px;
    padding: 10px;
    user-select: none;
  }
  .admin-link:hover{color: var(--primary);}

  /* PIN Row */
  .pin-row{
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .pin-row input{flex: 1;}
  .pin-row button{
    padding: 0 20px;
    min-height: 48px;
    border: none;
    border-radius: 9px;
    background: var(--primary);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .pin-row button:hover{background: var(--primary-dark);}

  /* Responsive Table */
  .table-responsive{
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 14px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
  }
  
  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 460px;
  }
  
  th, td{
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  
  th{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--ink-soft);
    font-size: 11.5px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  tr:last-child td{border-bottom: none;}
  tr:hover td{background: rgba(0,0,0,0.015);}

  .tag{
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    white-space: nowrap;
    margin-top: 4px;
  }
  .tag.open{background: #FBEDE3; color: var(--danger);}
  .tag.closed{background: #E4F0E9; color: var(--success);}
  .tag.warn{background: #FFF3CD; color: #856404;}

  .date-sub{
    font-size: 11px;
    color: var(--ink-soft);
    display: block;
    margin-top: 2px;
  }

  /* Admin Toolbar */
  .toolbar{
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .toolbar button{
    flex: 1 1 auto;
    min-height: 44px;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .toolbar button:hover{
    background: var(--bg);
  }

  /* QR Code Box */
  #qrbox{
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 0 8px;
  }
  #qrbox img, #qrbox canvas {
    max-width: 100%;
    height: auto !important;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .qr-hint{
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 6px;
    line-height: 1.4;
  }

  .empty{
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align: center;
    padding: 24px 16px;
    line-height: 1.5;
  }
  .hidden{display: none !important;}

  @media (min-width: 768px){
    body { padding-top: 36px; }
    .card { padding: 24px 22px; }
    .masthead h1 { font-size: 23px; }
    .submit-btn:hover { opacity: 0.94; }
  }
</style>
</head>
<body>
<div class="wrap" id="mainWrap">

  <div class="masthead">
    <h1>Pos Jaga Asrama<br>Catatan Keluar &amp; Masuk</h1>
    <div class="clock">
      <div id="tanggal">—</div>
      <div class="time" id="jam">--:-- WIB</div>
    </div>
  </div>

  <!-- FORM UTAMA -->
  <div class="card" id="formCard">
    <div class="toggle">
      <button type="button" class="active keluar" id="btnKeluar">Keluar</button>
      <button type="button" class="masuk" id="btnMasuk">Masuk</button>
    </div>

    <!-- FORM MODE KELUAR -->
    <form id="formKeluar">
      <!-- Pemohon Utama -->
      <div class="autocomplete-wrap">
        <label for="santriSearchInput">Nama santri (Pemohon Utama)</label>
        <div class="search-box">
          <input type="text" id="santriSearchInput" placeholder="Ketik nama Anda (cth. Zaki / Adis)..." autocomplete="off" required>
          <button type="button" id="btnClearSantri" class="btn-clear-search hidden" title="Hapus">&times;</button>
        </div>
        <div id="santriDropdownList" class="dropdown-results hidden"></div>
      </div>

      <label for="kelasKeluar">Kelas <span class="readonly-badge">Otomatis</span></label>
      <input type="text" id="kelasKeluar" readonly placeholder="Terisi otomatis saat nama dipilih">

      <label for="kamarKeluar">Kamar / Lorong <span class="readonly-badge">Otomatis</span></label>
      <input type="text" id="kamarKeluar" readonly placeholder="Terisi otomatis saat nama dipilih">

      <!-- Fitur Pergi Bareng Teman -->
      <div class="group-section">
        <div class="group-header">
          <span class="group-title">👥 Pergi bersama teman?</span>
          <button type="button" id="btnToggleAddFriend" class="btn-add-friend">+ Tambah Teman</button>
        </div>

        <!-- Box Pencarian Teman -->
        <div id="friendSearchBox" class="autocomplete-wrap hidden" style="margin-top:8px;">
          <div class="search-box">
            <input type="text" id="friendSearchInput" placeholder="Ketik nama teman yang ikut..." autocomplete="off">
            <button type="button" id="btnCloseFriendSearch" class="btn-clear-search" title="Tutup">&times;</button>
          </div>
          <div id="friendDropdownList" class="dropdown-results hidden"></div>
        </div>

        <!-- Daftar Teman yang Ikut -->
        <div id="friendsChipsList" class="friends-chips-list"></div>
      </div>

      <label for="tujuan">Tujuan / keperluan keluar</label>
      <textarea id="tujuan" required placeholder="cth. Beli makan malam, kerja kelompok, pulang ke rumah..."></textarea>

      <button type="submit" class="submit-btn keluar" id="btnSubmitKeluar">
        <span>Catat waktu keluar</span>
      </button>
    </form>

    <!-- FORM MODE MASUK (HANYA MUNCUL KELUAR DI HARI YANG SAMA) -->
    <div id="sectionMasuk" class="hidden">
      <label style="margin-top:0">Santri yang sedang di luar hari ini:</label>
      <div class="search-masuk-box">
        <input type="text" id="searchMasukInput" placeholder="🔍 Cari nama Anda di daftar ini...">
      </div>
      <div id="activeListWrap" class="active-list">
        <div class="empty">Memuat daftar santri di luar...</div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="admin-link" id="adminToggle">Buka rekap &amp; QR (pengurus asrama)</div>

  <!-- GERBANG PIN -->
  <div class="card hidden" id="pinCard">
    <label for="pinInput">Masukkan PIN pengurus</label>
    <div class="pin-row">
      <input type="password" id="pinInput" placeholder="Masukkan PIN pengurus" inputmode="numeric">
      <button type="button" id="pinBtn">Masuk</button>
    </div>
  </div>

  <!-- PANEL ADMIN -->
  <div class="card hidden" id="adminCard">
    <label style="margin-top:0">Link Website / QR Code Form</label>
    <div class="pin-row">
      <input type="text" id="publicUrl" placeholder="Tempel URL website di sini">
      <button type="button" id="qrBtn">Perbarui QR</button>
    </div>
    <div class="qr-hint">Cetak QR Code ini dan tempel di Pos Jaga agar santri bisa langsung scan lewat HP.</div>

    <div id="qrbox"></div>
    <div class="qr-hint" id="qrUrlLabel"></div>

    <div class="toolbar">
      <button type="button" id="reloadBtn">🔄 Muat Ulang</button>
      <button type="button" id="csvBtn">📥 Unduh CSV</button>
      <button type="button" id="logoutBtn" style="color:var(--danger)">🔒 Kunci</button>
    </div>

    <div class="table-responsive">
      <div id="rekapWrap"></div>
    </div>
  </div>

</div>

<script>

// Filter pencarian nama pemohon utama
function filterSantriDropdown(query = ''){
  const q = query.trim().toLowerCase();
  const listEl = document.getElementById('santriDropdownList');
  const clearBtn = document.getElementById('btnClearSantri');
  
  clearBtn.classList.toggle('hidden', q.length === 0 && !selectedSantri);

  const matches = masterSantri.filter(s => {
    // Kecualikan teman yang sudah ada di list
    const isAlreadyFriend = addedFriends.some(f => (f.id && f.id === s.id) || f.nama === s.nama);
    return !isAlreadyFriend && (s.nama.toLowerCase().includes(q) || s.kamar.toLowerCase().includes(q));
  });

  if (matches.length === 0) {
    listEl.innerHTML = '<div class="dropdown-empty">Nama tidak ditemukan. Silakan periksa ejaan atau hubungi pengurus asrama.</div>';
    listEl.classList.remove('hidden');
    return;
  }

  let html = matches.slice(0, 15).map(s => `
    <div class="dropdown-item" 
         data-id="${escapeHtml(s.id)}" 
         data-nama="${escapeHtml(s.nama)}" 
         data-kelas="${escapeHtml(s.kelas)}" 
         data-kamar="${escapeHtml(s.kamar)}">
      <div>
        <strong>${highlightMatch(s.nama, q)}</strong>
      </div>
      <span>${escapeHtml(s.kamar)}</span>
    </div>
  `).join('');

  listEl.innerHTML = html;
  listEl.classList.remove('hidden');

  listEl.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', () => {
      selectSantri({
        id: item.dataset.id,
        nama: item.dataset.nama,
        kelas: item.dataset.kelas,
        kamar: item.dataset.kamar
      });
    });
  });
}

// Filter pencarian nama teman
function filterFriendDropdown(query = ''){
  const q = query.trim().toLowerCase();
  const listEl = document.getElementById('friendDropdownList');

  const matches = masterSantri.filter(s => {
    const isLeader = selectedSantri && ((selectedSantri.id && selectedSantri.id === s.id) || selectedSantri.nama === s.nama);
    const isAlreadyFriend = addedFriends.some(f => (f.id && f.id === s.id) || f.nama === s.nama);
    return !isLeader && !isAlreadyFriend && (s.nama.toLowerCase().includes(q) || s.kamar.toLowerCase().includes(q));
  });

  if (matches.length === 0) {
    listEl.innerHTML = '<div class="dropdown-empty">Nama tidak ditemukan atau sudah ditambahkan.</div>';
    listEl.classList.remove('hidden');
    return;
  }

  let html = matches.slice(0, 15).map(s => `
    <div class="dropdown-item" 
         data-id="${escapeHtml(s.id)}" 
         data-nama="${escapeHtml(s.nama)}" 
         data-kelas="${escapeHtml(s.kelas)}" 
         data-kamar="${escapeHtml(s.kamar)}">
      <div>
        <strong>${highlightMatch(s.nama, q)}</strong>
      </div>
      <span>${escapeHtml(s.kamar)}</span>
    </div>
  `).join('');

  listEl.innerHTML = html;
  listEl.classList.remove('hidden');

  listEl.querySelectorAll('.dropdown-item').forEach(item => {
    item.addEventListener('click', () => {
      addFriend({
        id: item.dataset.id,
        nama: item.dataset.nama,
        kelas: item.dataset.kelas,
        kamar: item.dataset.kamar
      });
    });
  });
}

function highlightMatch(text, query){
  if (!query) return escapeHtml(text);
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escapeHtml(text).replace(regex, '<mark style="background:#FFE699;padding:0 2px;border-radius:2px">$1</mark>');
}

function selectSantri(santri){
  selectedSantri = santri;
  document.getElementById('santriSearchInput').value = santri.nama;
  document.getElementById('kelasKeluar').value = santri.kelas || '-';
  document.getElementById('kamarKeluar').value = santri.kamar || '-';
  document.getElementById('santriDropdownList').classList.add('hidden');
  document.getElementById('btnClearSantri').classList.remove('hidden');
  updateSubmitButtonText();
  hideFeedback();
}

function clearSantriSelection(shouldFocus = false){
  selectedSantri = null;
  document.getElementById('santriSearchInput').value = '';
  document.getElementById('kelasKeluar').value = '';
  document.getElementById('kamarKeluar').value = '';
  document.getElementById('santriDropdownList').classList.add('hidden');
  document.getElementById('btnClearSantri').classList.add('hidden');
  updateSubmitButtonText();
  if (shouldFocus) {
    document.getElementById('santriSearchInput').focus();
  }
}

function addFriend(friend){
  if (!addedFriends.some(f => (f.id && f.id === friend.id) || f.nama === friend.nama)) {
    addedFriends.push(friend);
    renderFriendsChips();
    document.getElementById('friendSearchInput').value = '';
    document.getElementById('friendDropdownList').classList.add('hidden');
    document.getElementById('friendSearchBox').classList.add('hidden');
    updateSubmitButtonText();
  }
}

function removeFriend(index){
  addedFriends.splice(index, 1);
  renderFriendsChips();
  updateSubmitButtonText();
}

function renderFriendsChips(){
  const wrap = document.getElementById('friendsChipsList');
  if (addedFriends.length === 0) {
    wrap.innerHTML = '';
    return;
  }

  let html = addedFriends.map((f, idx) => `
    <div class="friend-chip">
      <div>
        🧑 <strong>${escapeHtml(f.nama)}</strong>
        <span>(${escapeHtml(f.kamar || '-')})</span>
      </div>
      <button type="button" class="btn-remove-friend" onclick="removeFriend(${idx})" title="Hapus teman">&times;</button>
    </div>
  `).join('');

  wrap.innerHTML = html;
}

function updateSubmitButtonText(){
  const btnSpan = document.getElementById('btnSubmitKeluar').querySelector('span');
  const total = (selectedSantri ? 1 : 0) + addedFriends.length;
  if (total > 1) {
    btnSpan.textContent = `Catat waktu keluar (${total} Orang)`;
  } else {
    btnSpan.textContent = `Catat waktu keluar`;
  }
}

function setMode(m){
  mode = m;
  document.getElementById('btnKeluar').classList.toggle('active', m==='keluar');
  document.getElementById('btnMasuk').classList.toggle('active', m==='masuk');
  
  if(m === 'keluar'){
    document.getElementById('formKeluar').classList.remove('hidden');
    document.getElementById('sectionMasuk').classList.add('hidden');
  } else {
    document.getElementById('formKeluar').classList.add('hidden');
    document.getElementById('sectionMasuk').classList.remove('hidden');
    document.getElementById('santriDropdownList').classList.add('hidden');
    document.getElementById('friendDropdownList').classList.add('hidden');
    loadActiveKeluarHariIni();
  }
  hideFeedback();
}

function nowParts(){
  const d = new Date();
  const tanggal = d.toLocaleDateString('id-ID', {
    timeZone: 'Asia/Jakarta', 
    weekday: 'long', 
    day: 'numeric', 
    month: 'short', 
    year: 'numeric'
  });
  const jam = d.toLocaleTimeString('id-ID', {
    timeZone: 'Asia/Jakarta', 
    hour: '2-digit', 
    minute: '2-digit'
  }).replace('.', ':');
  return { tanggal, jam: `${jam} WIB` };
}

function tickClock(){
  const {tanggal, jam} = nowParts();
  document.getElementById('tanggal').textContent = tanggal;
  document.getElementById('jam').textContent = jam;
}

function showFeedback(htmlMsg, type){
  const el = document.getElementById('feedback');
  el.innerHTML = htmlMsg;
  el.className = 'feedback show ' + type;
}
function hideFeedback(){
  document.getElementById('feedback').className = 'feedback';
}

async function syncFromGoogleSheets(){
  try{
    const res = await fetch(`${SCRIPT_URL}?action=init`);
    const result = await res.json();
    if(result.status === 'success'){
      if(result.santri && result.santri.length > 0){
        masterSantri = result.santri;
      }
      if(result.activeKeluar){
        activeKeluarHariIni = result.activeKeluar;
        if(mode === 'masuk') renderActiveList();
      }
    }
  }catch(e){
    console.log('Menggunakan database offline lokal');
  }
}

async function loadActiveKeluarHariIni(){
  const wrap = document.getElementById('activeListWrap');
  wrap.innerHTML = '<div class="empty">Memuat daftar santri di luar hari ini...</div>';
  
  try{
    const res = await fetch(`${SCRIPT_URL}?action=init`);
    const result = await res.json();
    if(result.status === 'success'){
      activeKeluarHariIni = result.activeKeluar || [];
      renderActiveList();
    } else {
      wrap.innerHTML = '<div class="empty">Gagal memuat data.</div>';
    }
  }catch(err){
    renderActiveList();
  }
}

function renderActiveList(filterKeyword = ''){
  const wrap = document.getElementById('activeListWrap');
  if(!activeKeluarHariIni || activeKeluarHariIni.length === 0){
    wrap.innerHTML = `
      <div class="empty">
        ✅ <strong>Tidak ada santri yang sedang berizin keluar hari ini.</strong><br>
        Semua santri yang izin keluar hari ini tercatat sudah kembali.
      </div>
    `;
    return;
  }

  let list = activeKeluarHariIni;
  if(filterKeyword.trim()){
    const fk = filterKeyword.trim().toLowerCase();
    list = list.filter(item => item.nama.toLowerCase().includes(fk) || item.kamar.toLowerCase().includes(fk));
  }

  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">Nama tidak ditemukan di daftar santri yang sedang keluar hari ini.</div>';
    return;
  }

  let html = list.map(item => `
    <div class="active-item">
      <div class="active-info">
        <strong>${escapeHtml(item.nama)}</strong>
        <span>${escapeHtml(item.kamar || '-')} · Keluar: <strong>${escapeHtml(item.jamKeluar || '-')}</strong></span>
        ${item.tujuan ? `<span style="font-style:italic">"${escapeHtml(item.tujuan)}"</span>` : ''}
      </div>
      <button type="button" class="btn-checkin" onclick="handleCheckIn('${escapeHtml(item.idSantri || '')}', '${escapeHtml(item.nama)}')">
        Saya Kembali
      </button>
    </div>
  `).join('');

  wrap.innerHTML = html;
}

// Submit Catatan KELUAR (Mendukung Pergi Sendiri maupun Bareng Teman)
async function handleSubmitKeluar(e){
  e.preventDefault();
  
  const searchInputVal = document.getElementById('santriSearchInput').value.trim();
  if(!selectedSantri || selectedSantri.nama.toLowerCase() !== searchInputVal.toLowerCase()){
    const found = masterSantri.find(s => s.nama.toLowerCase() === searchInputVal.toLowerCase());
    if(found){
      selectSantri(found);
    } else {
      showFeedback('Silakan pilih nama santri utama dari daftar pencarian yang muncul.', 'warn');
      return;
    }
  }

  // Gabungkan pemohon utama + semua teman
  const allMembers = [
    {
      idSantri: selectedSantri.id || '',
      nama: selectedSantri.nama,
      kelas: selectedSantri.kelas || '',
      kamar: selectedSantri.kamar || ''
    },
    ...addedFriends.map(f => ({
      idSantri: f.id || '',
      nama: f.nama,
      kelas: f.kelas || '',
      kamar: f.kamar || ''
    }))
  ];

  const tujuan = document.getElementById('tujuan').value.trim();
  const btn = document.getElementById('btnSubmitKeluar');
  const span = btn.querySelector('span');

  if(!tujuan){
    showFeedback('Silakan isi tujuan / keperluan keluar.', 'warn');
    return;
  }

  btn.disabled = true;
  const originalText = span.textContent;
  span.textContent = 'Menyimpan...';
  showFeedback('Sedang mencatat waktu keluar ke sistem...', 'info');

  try{
    const payload = {
      mode: 'keluar',
      data: { 
        idSantri: allMembers[0].idSantri || '',
        nama: allMembers[0].nama,
        kelas: allMembers[0].kelas || '',
        kamar: allMembers[0].kamar || '',
        members: allMembers, 
        tujuan: tujuan 
      }
    };

    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      redirect: 'follow'
    });

    const rawText = await response.text();
    let result;
    try {
      result = JSON.parse(rawText);
    } catch(e) {
      console.error('Response bukan JSON:', rawText);
      throw new Error('Respon server tidak valid. Pastikan hak akses Google Apps Script disetel ke "Siapa Saja (Anyone)".');
    }

    if(result.status === 'success'){
      if(document.activeElement) document.activeElement.blur();
      showFeedback(result.message, 'ok');
      document.getElementById('formKeluar').reset();
      clearSantriSelection(false);
      addedFriends = [];
      renderFriendsChips();
      updateSubmitButtonText();
      syncFromGoogleSheets();
      
      const fb = document.getElementById('feedback');
      if(fb) fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      showFeedback('Terjadi kesalahan: ' + (result.message || 'Gagal menyimpan.'), 'warn');
    }
  } catch(err){
    console.error(err);
    showFeedback('Gagal menghubungi Google Sheets: ' + (err.message || 'Periksa koneksi internet.'), 'warn');
  } finally {
    btn.disabled = false;
    span.textContent = originalText;
  }
}

// Submit Catatan MASUK
async function handleCheckIn(idSantri, nama){
  if(!confirm(`Konfirmasi: ${nama} sudah kembali ke asrama sekarang?`)){
    return;
  }

  showFeedback(`Mencatat kepulangan untuk <strong>${nama}</strong>...`, 'info');

  try{
    const payload = {
      mode: 'masuk',
      data: { idSantri, nama }
    };

    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      redirect: 'follow'
    });

    const rawText = await response.text();
    let result;
    try {
      result = JSON.parse(rawText);
    } catch(e) {
      throw new Error('Respon server tidak valid.');
    }

    if(result.status === 'success'){
      showFeedback(result.message, 'ok');
      loadActiveKeluarHariIni();
    } else {
      showFeedback(result.message || 'Gagal mencatat masuk.', 'warn');
    }
  }catch(err){
    showFeedback('Gagal menghubungi server: ' + (err.message || 'Periksa koneksi internet.'), 'warn');
  }
}

function toggleAdmin(){
  const pinCard = document.getElementById('pinCard');
  const adminCard = document.getElementById('adminCard');
  const wrap = document.getElementById('mainWrap');

  if(!adminCard.classList.contains('hidden') || !pinCard.classList.contains('hidden')){
    pinCard.classList.add('hidden');
    adminCard.classList.add('hidden');
    wrap.classList.remove('wide');
    document.getElementById('adminToggle').textContent = 'Buka rekap & QR (pengurus asrama)';
  } else {
    pinCard.classList.remove('hidden');
    document.getElementById('adminToggle').textContent = 'Tutup panel pengurus';
  }
}

function checkPin(){
  const val = document.getElementById('pinInput').value.trim();
  const wrap = document.getElementById('mainWrap');

  if(val === ADMIN_PIN){
    document.getElementById('pinCard').classList.add('hidden');
    document.getElementById('adminCard').classList.remove('hidden');
    wrap.classList.add('wide');
    document.getElementById('pinInput').value = '';
    initAdminPanel();
  } else {
    document.getElementById('pinInput').style.outline = '2px solid var(--danger)';
    document.getElementById('pinInput').value = '';
    alert('PIN salah!');
  }
}

function lockAdminPanel(){
  document.getElementById('adminCard').classList.add('hidden');
  document.getElementById('pinCard').classList.remove('hidden');
  document.getElementById('mainWrap').classList.remove('wide');
}

function initAdminPanel(){
  const currentUrl = window.location.href;
  const publicInput = document.getElementById('publicUrl');
  if(!publicInput.value){
    publicInput.value = currentUrl;
  }
  renderQr();
  loadRekap();
}

function renderQr(){
  const url = document.getElementById('publicUrl').value.trim();
  const box = document.getElementById('qrbox');
  const label = document.getElementById('qrUrlLabel');
  box.innerHTML = '';
  if(!url){
    label.textContent = 'Tempel link publik dulu, lalu klik "Perbarui QR".';
    return;
  }
  if(typeof QRCode === 'undefined'){
    label.textContent = 'Gagal memuat pustaka QR.';
    return;
  }
  new QRCode(box, { text: url, width: 180, height: 180, colorDark: '#1F4B4C', colorLight: '#FFFFFF' });
  label.textContent = url;
}

async function loadRekap(){
  const wrap = document.getElementById('rekapWrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="empty">Memuat riwayat log dari Google Sheets…</div>';

  try{
    const response = await fetch(`${SCRIPT_URL}?pin=${ADMIN_PIN}`);
    const result = await response.json();
    
    if(result.status === 'success'){
      lastRecords = result.data || [];
      renderTable(lastRecords);
    } else {
      wrap.innerHTML = '<div class="empty">Gagal memuat data: ' + (result.message || '') + '</div>';
    }
  } catch(err){
    console.error(err);
    wrap.innerHTML = '<div class="empty">Gagal memuat data. Periksa koneksi atau izin Web App.</div>';
  }
}

function renderTable(records){
  const wrap = document.getElementById('rekapWrap');
  if(records.length === 0){
    wrap.innerHTML = '<div class="empty">Belum ada catatan perizinan di Spreadsheet.</div>';
    return;
  }
  let rows = records.map(r => `
    <tr>
      <td>
        <strong>${escapeHtml(r.nama)}</strong><br>
        <span style="color:var(--ink-soft)">${escapeHtml(r.kelas||'-')} · Kamar ${escapeHtml(r.kamar||'-')}</span>
      </td>
      <td>${escapeHtml(r.tujuan || '-')}</td>
      <td>
        ${escapeHtml(r.jamKeluar || '-')}
        <span class="date-sub">${escapeHtml(r.tanggal || '')}</span>
      </td>
      <td>
        ${r.jamMasuk ? `<strong>${escapeHtml(r.jamMasuk)}</strong>` : ''}
        ${r.status === 'Belum Kembali' 
          ? '<br><span class="tag open">Belum Kembali</span>' 
          : r.status === 'Tanpa Izin Keluar' 
            ? '<br><span class="tag warn">Tanpa Izin</span>' 
            : (r.durasi && r.durasi !== '-' ? `<br><span class="tag closed">⏱ ${escapeHtml(r.durasi)}</span>` : (r.jamMasuk ? '<br><span class="tag closed">Kembali</span>' : ''))
        }
      </td>
    </tr>
  `).join('');
  
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Santri</th>
          <th>Tujuan</th>
          <th>Keluar</th>
          <th>Masuk &amp; Status</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function exportCsv(){
  if(!lastRecords.length){ 
    alert('Belum ada data untuk diunduh.');
    return; 
  }
  const header = ['ID', 'Tanggal', 'ID Santri', 'Nama', 'Kelas', 'Kamar', 'Tujuan', 'Jam Keluar', 'Jam Masuk', 'Durasi', 'Status'];
  const rows = lastRecords.map(r => [
    r.id || '',
    r.tanggal || '',
    r.idSantri || '',
    r.nama || '', 
    r.kelas || '', 
    r.kamar || '',
    (r.tujuan || '').replace(/[\r\n,]+/g,' '),
    r.jamKeluar || '',
    r.jamMasuk || '',
    r.durasi || '',
    r.status || ''
  ]);
  const csv = [header, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rekap-asrama-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
