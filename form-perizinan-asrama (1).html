<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pos Jaga Asrama — Catatan Keluar Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg: #EEF2ED;
    --surface: #FFFFFF;
    --ink: #202B28;
    --ink-soft: #5C6864;
    --primary: #1F4B4C;
    --primary-dark: #143332;
    --accent: #E0982A;
    --danger: #B5482E;
    --success: #3E7A5D;
    --border: #D7DED9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--primary);
    padding-bottom:14px;
    margin-bottom:20px;
  }
  .masthead h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    margin:0;
    color:var(--primary-dark);
    line-height:1.15;
  }
  .clock{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    color:var(--ink-soft);
    font-size:13px;
  }
  .clock .time{font-size:20px;color:var(--primary-dark);font-weight:500;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px;
    margin-bottom:16px;
  }

  .toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .toggle button{
    flex:1;
    padding:13px 0;
    border:none;
    background:var(--surface);
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .toggle button.active.keluar{background:var(--danger);color:#fff;}
  .toggle button.active.masuk{background:var(--success);color:#fff;}
  .toggle button:not(.active):hover{background:var(--bg);}

  label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  label:first-of-type{margin-top:0;}
  input, textarea, select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:var(--bg);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--primary);
    outline-offset:0;
    background:var(--surface);
  }
  textarea{resize:vertical;min-height:60px;}

  .submit-btn{
    width:100%;
    margin-top:20px;
    padding:14px 0;
    border:none;
    border-radius:8px;
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
  }
  .submit-btn.keluar{background:var(--danger);}
  .submit-btn.masuk{background:var(--success);}
  .submit-btn:disabled{background:var(--ink-soft);cursor:not-allowed;}

  .feedback{
    margin-top:14px;
    padding:12px 14px;
    border-radius:7px;
    font-size:14px;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#E4F0E9;color:var(--success);border:1px solid #BFDECB;}
  .feedback.warn{background:#FBEDE3;color:var(--danger);border:1px solid #F0CDB8;}

  .admin-link{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    margin-top:8px;
  }

  .pin-row{display:flex;gap:8px;}
  .pin-row input{flex:1;}
  .pin-row button{
    padding:0 18px;
    border:none;
    border-radius:7px;
    background:var(--primary);
    color:#fff;
    font-weight:600;
    cursor:pointer;
  }

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
  th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
  th{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink-soft);font-size:11px;text-transform:none;}
  tr:last-child td{border-bottom:none;}
  .tag{
    display:inline-block;
    padding:2px 7px;
    border-radius:20px;
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
  }
  .tag.open{background:#FBEDE3;color:var(--danger);}
  .tag.closed{background:#E4F0E9;color:var(--success);}

  .toolbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .toolbar button{
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .toolbar button:hover{background:var(--bg);}

  #qrbox{display:flex;justify-content:center;padding:12px 0;}
  .qr-hint{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:6px;}

  .empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:16px 0;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Pos Jaga Asrama<br>Catatan Keluar &amp; Masuk</h1>
    <div class="clock">
      <div id="tanggal">—</div>
      <div class="time" id="jam">--:--</div>
    </div>
  </div>

  <!-- FORM UTAMA -->
  <div class="card" id="formCard">
    <div class="toggle">
      <button type="button" class="active keluar" id="btnKeluar">Keluar</button>
      <button type="button" class="masuk" id="btnMasuk">Masuk</button>
    </div>

    <form id="logForm">
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" required placeholder="cth. Siti Rahma">

      <label for="kelas">Kelas</label>
      <select id="kelas" required>
        <option value="" disabled selected>Pilih kelas</option>
        <option value="Dasar">Dasar</option>
        <option value="Lambatan">Lambatan</option>
        <option value="Cepatan">Cepatan</option>
        <option value="Lanjutan">Lanjutan</option>
      </select>

      <label for="kamar">Nomor kamar</label>
      <select id="kamar" required>
        <option value="" disabled selected>Pilih nomor kamar</option>
        <option value="2T Putra">2T Putra</option>
        <option value="2B Putra">2B Putra</option>
        <option value="3B Putra">3B Putra</option>
        <option value="3T Putra">3T Putra</option>
        <option value="2B Putri">2B Putri</option>
        <option value="2T Putri">2T Putri</option>
        <option value="3B Putri">3B Putri</option>
        <option value="3T Putri">3T Putri</option>
        <option value="4B Putri">4B Putri</option>
        <option value="4T Putri">4T Putri</option>
      </select>

      <div id="tujuanField">
        <label for="tujuan">Tujuan / keperluan keluar</label>
        <textarea id="tujuan" placeholder="cth. Beli makan malam, pulang ke rumah, kuliah malam..."></textarea>
      </div>

      <button type="submit" class="submit-btn keluar" id="submitBtn">Catat waktu keluar</button>
    </form>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="admin-link" id="adminToggle">Buka rekap &amp; QR (pengurus asrama)</div>

  <!-- GERBANG PIN -->
  <div class="card hidden" id="pinCard">
    <label for="pinInput">Masukkan PIN pengurus</label>
    <div class="pin-row">
      <input type="password" id="pinInput" placeholder="PIN">
      <button type="button" id="pinBtn">Masuk</button>
    </div>
    <div class="qr-hint">PIN default: 2468 — ganti di kode sumber untuk keamanan lebih baik.</div>
  </div>

  <!-- PANEL ADMIN -->
  <div class="card hidden" id="adminCard">
    <label style="margin-top:0">Link publik hasil publish</label>
    <div class="pin-row">
      <input type="text" id="publicUrl" placeholder="Tempel link publik di sini">
      <button type="button" id="qrBtn">Buat QR</button>
    </div>
    <div class="qr-hint">Ambil link ini dari tombol Publish/Share di artifact, bukan dari alamat browser saat mengedit.</div>

    <div id="qrbox"></div>
    <div class="qr-hint" id="qrUrlLabel"></div>

    <div class="toolbar">
      <button type="button" id="reloadBtn">Muat ulang data</button>
      <button type="button" id="csvBtn">Unduh CSV</button>
    </div>

    <div id="rekapWrap"></div>
  </div>

</div>

<script>
let mode = 'keluar';

function slug(s){
  return String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function setMode(m){
  mode = m;
  document.getElementById('btnKeluar').classList.toggle('active', m==='keluar');
  document.getElementById('btnMasuk').classList.toggle('active', m==='masuk');
  document.getElementById('tujuanField').style.display = m==='keluar' ? 'block' : 'none';
  document.getElementById('tujuan').required = (m==='keluar');
  const btn = document.getElementById('submitBtn');
  btn.className = 'submit-btn ' + m;
  btn.textContent = m==='keluar' ? 'Catat waktu keluar' : 'Catat waktu masuk';
  hideFeedback();
}

function nowParts(){
  const d = new Date();
  const tanggal = d.toLocaleDateString('id-ID', {timeZone:'Asia/Jakarta', weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const jam = d.toLocaleTimeString('id-ID', {timeZone:'Asia/Jakarta', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  return {d, tanggal, jam};
}
function tickClock(){
  const {tanggal, jam} = nowParts();
  document.getElementById('tanggal').textContent = tanggal;
  document.getElementById('jam').textContent = jam;
}

function showFeedback(msg, type){
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback show ' + type;
}
function hideFeedback(){
  document.getElementById('feedback').className = 'feedback';
}

async function handleSubmit(e){
  e.preventDefault();
  const nama = document.getElementById('nama').value.trim();
  const kelas = document.getElementById('kelas').value;
  const kamar = document.getElementById('kamar').value.trim();
  const tujuan = document.getElementById('tujuan').value.trim();
  const btn = document.getElementById('submitBtn');

  if(!nama || !kelas || !kamar || (mode==='keluar' && !tujuan)){
    showFeedback('Mohon lengkapi semua kolom terlebih dahulu.', 'warn');
    return;
  }

  if(typeof window.storage === 'undefined'){
    showFeedback('Penyimpanan data tidak tersedia di halaman ini. Pastikan form dibuka lewat link publik hasil Publish, bukan file HTML yang didownload.', 'warn');
    return;
  }

  const idKey = slug(nama + '_' + kamar);
  btn.disabled = true;

  try{
    if(mode === 'keluar'){
      const ts = Date.now();
      const record = { nama, kelas, kamar, tujuan, jamKeluar: ts, jamMasuk: null };
      await window.storage.set(`trip:${idKey}:${ts}`, JSON.stringify(record), true);
      showFeedback(`Tercatat: ${nama} keluar pukul ${nowParts().jam}. Jangan lupa isi form "Masuk" saat kembali.`, 'ok');
    } else {
      const listRes = await window.storage.list(`trip:${idKey}:`, true);
      const keys = (listRes && listRes.keys) ? listRes.keys : [];
      let openKey = null, openTs = -1;
      for(const k of keys){
        const res = await window.storage.get(k, true);
        if(!res) continue;
        const rec = JSON.parse(res.value);
        if(rec.jamMasuk === null){
          const ts = parseInt(k.split(':').pop(), 10);
          if(ts > openTs){ openTs = ts; openKey = k; }
        }
      }
      if(openKey){
        const res = await window.storage.get(openKey, true);
        const rec = JSON.parse(res.value);
        rec.jamMasuk = Date.now();
        rec.kelas = kelas || rec.kelas;
        rec.kamar = kamar || rec.kamar;
        await window.storage.set(openKey, JSON.stringify(rec), true);
        showFeedback(`Selamat datang kembali, ${nama}. Waktu masuk tercatat pukul ${nowParts().jam}.`, 'ok');
      } else {
        const ts = Date.now();
        const record = { nama, kelas, kamar, tujuan: '', jamKeluar: null, jamMasuk: ts };
        await window.storage.set(`trip:${idKey}:${ts}`, JSON.stringify(record), true);
        showFeedback(`Waktu masuk tercatat, tapi tidak ditemukan catatan "keluar" sebelumnya. Mohon konfirmasi ke pengurus asrama.`, 'warn');
      }
    }
    document.getElementById('logForm').reset();
  } catch(err){
    console.error(err);
    showFeedback('Gagal menyimpan data. Periksa koneksi dan coba lagi.', 'warn');
  } finally {
    btn.disabled = false;
  }
}

function toggleAdmin(){
  const pinCard = document.getElementById('pinCard');
  const adminCard = document.getElementById('adminCard');
  if(!adminCard.classList.contains('hidden') || !pinCard.classList.contains('hidden')){
    pinCard.classList.add('hidden');
    adminCard.classList.add('hidden');
    document.getElementById('adminToggle').textContent = 'Buka rekap & QR (pengurus asrama)';
  } else {
    pinCard.classList.remove('hidden');
    document.getElementById('adminToggle').textContent = 'Tutup panel pengurus';
  }
}

const ADMIN_PIN = '2468';
function checkPin(){
  const val = document.getElementById('pinInput').value;
  if(val === ADMIN_PIN){
    document.getElementById('pinCard').classList.add('hidden');
    document.getElementById('adminCard').classList.remove('hidden');
    prefillUrl();
    loadRekap();
  } else {
    document.getElementById('pinInput').style.outline = '2px solid var(--danger)';
    document.getElementById('pinInput').value = '';
  }
}

async function prefillUrl(){
  try{
    const res = await window.storage.get('admin:qrUrl', false);
    if(res && res.value){
      document.getElementById('publicUrl').value = res.value;
      renderQr();
    }
  } catch(e){ /* belum pernah diisi */ }
}

async function renderQr(){
  const url = document.getElementById('publicUrl').value.trim();
  const box = document.getElementById('qrbox');
  const label = document.getElementById('qrUrlLabel');
  box.innerHTML = '';
  if(!url){
    label.textContent = 'Tempel link publik dulu, lalu klik "Buat QR".';
    return;
  }
  if(typeof QRCode === 'undefined'){
    label.textContent = 'Gagal memuat pustaka QR. Coba muat ulang halaman.';
    return;
  }
  new QRCode(box, { text: url, width: 180, height: 180, colorDark: '#1F4B4C', colorLight: '#FFFFFF' });
  label.textContent = url;
  try{
    if(window.storage) await window.storage.set('admin:qrUrl', url, false);
  } catch(e){ /* tidak fatal */ }
}

let lastRecords = [];

async function loadRekap(){
  const wrap = document.getElementById('rekapWrap');
  wrap.innerHTML = '<div class="empty">Memuat data…</div>';
  try{
    const listRes = await window.storage.list('trip:', true);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    const records = [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k, true);
        if(res) records.push(JSON.parse(res.value));
      } catch(e){ /* skip */ }
    }
    records.sort((a,b) => (b.jamKeluar || b.jamMasuk || 0) - (a.jamKeluar || a.jamMasuk || 0));
    lastRecords = records;
    renderTable(records);
  } catch(err){
    console.error(err);
    wrap.innerHTML = '<div class="empty">Gagal memuat data.</div>';
  }
}

function fmtTime(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleString('id-ID', {timeZone:'Asia/Jakarta', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function fmtDurasi(a,b){
  if(!a || !b) return '—';
  const mins = Math.round((b-a)/60000);
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? `${h}j ${m}m` : `${m}m`;
}

function renderTable(records){
  const wrap = document.getElementById('rekapWrap');
  if(records.length === 0){
    wrap.innerHTML = '<div class="empty">Belum ada catatan.</div>';
    return;
  }
  let rows = records.map(r => `
    <tr>
      <td>${r.nama}<br><span style="color:var(--ink-soft)">${r.kelas||'—'} · ${r.kamar||'—'}</span></td>
      <td>${r.tujuan || '—'}</td>
      <td>${fmtTime(r.jamKeluar)}</td>
      <td>${fmtTime(r.jamMasuk)}<br>${r.jamMasuk===null ? '<span class="tag open">belum kembali</span>' : `<span class="tag closed">${fmtDurasi(r.jamKeluar,r.jamMasuk)}</span>`}</td>
    </tr>
  `).join('');
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Santri</th><th>Tujuan</th><th>Keluar</th><th>Masuk</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function exportCsv(){
  if(!lastRecords.length){ return; }
  const header = ['Nama','Kelas','Kamar','Tujuan','Jam Keluar','Jam Masuk','Durasi'];
  const rows = lastRecords.map(r => [
    r.nama, r.kelas||'', r.kamar||'',
    (r.tujuan||'').replace(/[\r\n,]+/g,' '),
    r.jamKeluar ? new Date(r.jamKeluar).toISOString() : '',
    r.jamMasuk ? new Date(r.jamMasuk).toISOString() : '',
    fmtDurasi(r.jamKeluar, r.jamMasuk)
  ]);
  const csv = [header, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rekap-asrama-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// --- Pasang semua event listener di sini (bukan atribut inline) ---
document.getElementById('btnKeluar').addEventListener('click', () => setMode('keluar'));
document.getElementById('btnMasuk').addEventListener('click', () => setMode('masuk'));
document.getElementById('logForm').addEventListener('submit', handleSubmit);
document.getElementById('adminToggle').addEventListener('click', toggleAdmin);
document.getElementById('pinBtn').addEventListener('click', checkPin);
document.getElementById('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') checkPin(); });
document.getElementById('qrBtn').addEventListener('click', renderQr);
document.getElementById('reloadBtn').addEventListener('click', loadRekap);
document.getElementById('csvBtn').addEventListener('click', exportCsv);

setMode('keluar');
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
